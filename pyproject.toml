[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loc-path"
version = "0.1.0"
description = "LoC-Path: training and evaluation code (built on XTuner)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  # Triton 3.0 imports setuptools at runtime (not just during builds).
  "setuptools>=77,<81",
  "torch==2.4.1",
  "transformers==4.51.1",
  "mmengine==0.10.5",
  "peft==0.12.0",
  "accelerate==1.2.0",
  "deepspeed==0.16.1",
  "bitsandbytes==0.43.3",
  "flash-attn==2.8.3",
  "datasets==3.1.0",
  "pyarrow==18.1.0",
  "numpy==1.26.4",
  "safetensors",
  "einops",
  "fairscale==0.4.13",
  "timm==1.0.19",
  "h5py",
  "pandas",
  "pillow",
  "sentencepiece",
  "tqdm",
  # evaluation (data_engine/evaluate_model_output_by_task2.py)
  "requests",
  "nltk",
  "rouge-score",
]

[project.optional-dependencies]
wandb = ["wandb>=0.21.1"]

[project.scripts]
xtuner = "xtuner:cli"

[tool.setuptools.packages.find]
include = ["xtuner*"]

[tool.setuptools.package-data]
xtuner = ["configs/**/*.py", "configs/**/*.json"]

[tool.uv]
# Training/inference is Linux + CUDA only.
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

# flash-attn needs torch at build time; build it against the locked torch.
[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]

# Static metadata so `uv lock` does not have to build flash-attn.
[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.8.3"
requires-dist = ["torch", "einops"]
